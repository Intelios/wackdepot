# Builds the Apple Silicon macOS app, packages it as a disk image, attaches it
# to a GitHub release, then rebuilds intelios.github.io so the download shows up.
#
# Opt-in per release: put <!-- build --> anywhere in the release notes before
# publishing. To build a release that's already out, run this workflow from the
# Actions tab and enter its tag.

name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. 1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.release.body, '<!-- build -->')
    runs-on: macos-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The production OAuth client is baked into the bundle from repo
      # secrets (see docs/GITHUB_SETUP.md; native-app client config, not a
      # server credential).
      - name: Build app
        env:
          WACKDEPOT_GITHUB_CLIENT_ID: ${{ secrets.WACKDEPOT_GITHUB_CLIENT_ID }}
          WACKDEPOT_GITHUB_CLIENT_SECRET: ${{ secrets.WACKDEPOT_GITHUB_CLIENT_SECRET }}
        run: sh scripts/bundle.sh

      # The bundled plist carries the workspace version; stamp the release tag
      # so Get Info reports the version the user downloaded.
      - name: Stamp release version
        run: |
          PLIST="dist/WackDepot.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${TAG#v}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${TAG#v}" "$PLIST"

      - name: Package disk image
        run: |
          staging=$(mktemp -d)
          ditto dist/WackDepot.app "$staging/WackDepot.app"
          ln -s /Applications "$staging/Applications"
          for attempt in 1 2 3; do
            hdiutil create -volname WackDepot -srcfolder "$staging" -format UDZO -ov "WackDepot-$TAG-macos.dmg" && break
            sleep 10
          done
          test -f "WackDepot-$TAG-macos.dmg"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "WackDepot-$TAG-macos.dmg" --clobber -R "$GITHUB_REPOSITORY"

  rebuild-site:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger website rebuild
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_REBUILD_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Intelios/Intelios.github.io/dispatches \
            -d '{"event_type":"rebuild"}'
        env:
          SITE_REBUILD_TOKEN: ${{ secrets.SITE_REBUILD_TOKEN }}
