[package]
name = "wackdepot-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
wackdepot-core.workspace = true
wackdepot-github.workspace = true
wackdepot-syntax.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
notify.workspace = true
image.workspace = true
smallvec.workspace = true
pulldown-cmark = "0.13"
# Native glass, appearance and accessibility (macOS only, by design).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSGlassEffectView",
    "NSApplication",
    "NSAppearance",
    "NSWorkspace",
    "NSAccessibility",
] }
raw-window-handle = "0.6"

[dev-dependencies]
tempfile.workspace = true
